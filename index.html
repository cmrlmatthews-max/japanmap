<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5EFE0">
<title>日本の旅 — Journey Through Japan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/web/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scroll">
  <img id="cap-left"  class="cap" src="assets/web/cap-left.png"  alt="">
  <img id="cap-right" class="cap" src="assets/web/cap-right.png" alt="">
  <canvas id="map"></canvas>
  <div id="capProbe"></div>

  <header id="title">
    <img src="assets/web/title.png" alt="日本の旅">
    <div class="sub">Journey Through Japan <span class="dot">·</span> Fall 2027</div>
  </header>

  <button id="who" class="seal on" title="Who is using this phone?" aria-label="Switch person" hidden><span>ケ</span></button>

  <nav id="seals" aria-label="Layers">
    <button class="seal on" data-layer="mist" title="Mist">霧</button>
    <button class="seal on" data-layer="camera" title="Camera moves">動</button>
    <button class="seal" data-layer="sound" title="Sound">音</button>
  </nav>

  <nav id="crests" aria-label="Regions">
    <button class="crest overview" data-region="overview" title="Overview" aria-label="Overview"><span class="ov">全</span></button>
    <button class="crest" data-region="tokyo"  title="Tokyo"  aria-label="Tokyo"><img src="assets/web/crest-tokyo.png"  alt=""><i>東京</i></button>
    <button class="crest" data-region="kyoto"  title="Kyoto"  aria-label="Kyoto"><img src="assets/web/crest-kyoto.png"  alt=""><i>京都</i></button>
    <button class="crest" data-region="nara"   title="Nara"   aria-label="Nara"><img src="assets/web/crest-nara.png"   alt=""><i>奈良</i></button>
    <button class="crest" data-region="osaka"  title="Osaka"  aria-label="Osaka"><img src="assets/web/crest-osaka.png"  alt=""><i>大阪</i></button>
    <button class="crest" data-region="hakone" title="Hakone" aria-label="Hakone"><img src="assets/web/crest-hakone.png" alt=""><i>箱根</i></button>
    <button class="crest" data-region="fuji"   title="Fuji"   aria-label="Fuji"><img src="assets/web/crest-fuji.png"   alt=""><i>富士</i></button>
  </nav>

  <nav id="filters" aria-label="Categories">
    <button class="seal on" data-cat="temple" title="Temples">寺</button>
    <button class="seal on" data-cat="shrine" title="Shrines">社</button>
    <button class="seal on" data-cat="ryokan" title="Ryokan">宿</button>
    <button class="seal on" data-cat="garden" title="Gardens">庭</button>
    <button class="seal on" data-cat="architecture" title="Architecture">建</button>
    <button class="seal on" data-cat="onsen" title="Onsen">湯</button>
    <button class="seal on" data-cat="technology" title="Technology">技</button>
    <button class="seal on" data-cat="art" title="Art">芸</button>
  </nav>

  <div id="region">
    <div class="kanji">中部・関西</div>
    <div class="yomi">ちゅうぶ・かんさい</div>
    <div class="en">Central Japan</div>
  </div>

  <aside id="card" aria-hidden="true" aria-label="Place details">
    <div class="grab"></div>
    <button class="x" aria-label="Close">×</button>
    <div class="scrollbox">
      <div class="head"><span class="cseal">寺</span><span class="cname">Temple</span><span class="status">定番 Core</span></div>
      <h2 class="k"></h2>
      <div class="y"></div>
      <div class="en"></div>
      <div class="reg"></div>
      <p class="why"></p>
      <dl class="rows"></dl>
      <div class="btns">
        <button class="btn add" type="button">Add to trip</button>
        <button class="btn pass" type="button">Pass</button>
      </div>
      <div class="src"></div>
    </div>
  </aside>

  <div id="whoPick" class="overlay" hidden>
    <div class="sheet">
      <div class="q">どなたですか</div>
      <div class="qe">Who is using this phone?</div>
      <div class="pair">
        <button class="who-btn" data-who="cade"><span class="big">ケ</span><b>Cade</b><i>ケイド</i></button>
        <button class="who-btn" data-who="casey"><span class="big">シ</span><b>Casey</b><i>ケイシー</i></button>
      </div>
    </div>
  </div>

  <div id="fade"></div>
  <div id="loading"><div class="brush"></div><div class="txt">墨を磨る<br><span>grinding the ink</span></div></div>
</div>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.hostname !== '127.0.0.1' && location.hostname !== 'localhost') { addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
