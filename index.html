<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F5EFE0">
<title>Journey Through Japan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/web/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@400;500&family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/route.css">
<link rel="stylesheet" href="css/trip.css">
<link rel="stylesheet" href="css/tips.css">
<link rel="stylesheet" href="css/inset.css">
<link rel="stylesheet" href="css/legend.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scroll">
  <img id="cap-left"  class="cap" src="assets/web/cap-left.png"  alt="">
  <img id="cap-right" class="cap" src="assets/web/cap-right.png" alt="">
  <canvas id="map"></canvas>
  <div id="capProbe"></div>

  <header id="title">
    <!-- the brush calligraphy stays as art; the English line under it is the readable title -->
    <img src="assets/web/title.png" alt="Journey Through Japan">
    <div class="sub"><span class="name">Journey Through Japan</span><span class="yr"><span class="dot">·</span> Fall 2027</span></div>
  </header>

  <button id="who" class="seal on" aria-label="Switch person" hidden><span class="who-ic" data-icon="person"></span><span class="who-name"></span></button>

  <nav id="seals" aria-label="Layers">
    <button class="seal" data-layer="3d" data-icon="cube" data-tip="3D · Tilt the map up" aria-label="3D view"><span class="lb">3D</span></button>
    <button class="seal on" data-layer="route" data-icon="route" aria-label="Route"><span class="lb">Route</span></button>
    <button class="seal on" data-layer="mist" data-icon="mist" aria-label="Mist"><span class="lb">Mist</span></button>
    <button class="seal on" data-layer="camera" data-icon="camera" aria-label="Motion"><span class="lb">Motion</span></button>
    <button class="seal" data-layer="sound" data-icon="sound" aria-label="Sound"><span class="lb">Sound</span></button>
  </nav>

  <nav id="crests" aria-label="Regions">
    <button class="crest overview" data-region="overview" aria-label="All"><span class="ov" data-icon="overview"></span><i>All</i></button>
    <button class="crest" data-region="tokyo"  aria-label="Tokyo"><img src="assets/web/crest-tokyo.png"  alt=""><i>Tokyo</i></button>
    <button class="crest" data-region="kyoto"  aria-label="Kyoto"><img src="assets/web/crest-kyoto.png"  alt=""><i>Kyoto</i></button>
    <button class="crest" data-region="nara"   aria-label="Nara"><img src="assets/web/crest-nara.png"   alt=""><i>Nara</i></button>
    <button class="crest" data-region="osaka"  aria-label="Osaka"><img src="assets/web/crest-osaka.png"  alt=""><i>Osaka</i></button>
    <button class="crest" data-region="hakone" aria-label="Hakone"><img src="assets/web/crest-hakone.png" alt=""><i>Hakone</i></button>
    <button class="crest" data-region="fuji"   aria-label="Mount Fuji"><img src="assets/web/crest-fuji.png"   alt=""><i>Fuji</i></button>
  </nav>

  <nav id="filters" aria-label="Categories">
    <button class="seal on" data-cat="temple" data-icon="temple" aria-label="Temples"><span class="lb">Temples</span></button>
    <button class="seal on" data-cat="shrine" data-icon="shrine" aria-label="Shrines"><span class="lb">Shrines</span></button>
    <button class="seal on" data-cat="ryokan" data-icon="ryokan" aria-label="Inns"><span class="lb">Inns</span></button>
    <button class="seal on" data-cat="garden" data-icon="garden" aria-label="Gardens"><span class="lb">Gardens</span></button>
    <button class="seal on" data-cat="architecture" data-icon="architecture" aria-label="Buildings"><span class="lb">Buildings</span></button>
    <button class="seal on" data-cat="onsen" data-icon="onsen" aria-label="Hot springs"><span class="lb">Hot springs</span></button>
    <button class="seal on" data-cat="technology" data-icon="technology" aria-label="Tech"><span class="lb">Tech</span></button>
    <button class="seal on" data-cat="art" data-icon="art" aria-label="Art"><span class="lb">Art</span></button>
  </nav>

  <!-- phone only (hidden above 600 px): four tabs. A tab opens a strip above the bar, or the itinerary sheet. Logic in js/ui.js -->
  <nav id="bar" aria-label="Map controls">
    <button class="tab" type="button" data-tab="regions" data-tip="Regions · Fly to a region" aria-label="Regions" aria-pressed="false"><span class="stamp" data-icon="regions"></span><span class="lb">Regions</span></button>
    <button class="tab" type="button" data-tab="filters" data-tip="Filters · Show or hide place types" aria-label="Filters" aria-pressed="false"><span class="stamp" data-icon="filters"></span><span class="lb">Filters</span></button>
    <button class="tab" type="button" data-tab="layers" data-tip="Layers · Route, mist, motion, sound, 3D" aria-label="Layers" aria-pressed="false"><span class="stamp" data-icon="layers"></span><span class="lb">Layers</span></button>
    <button class="tab" type="button" data-tab="trip" data-tip="Trip · Open the itinerary" aria-label="Trip" aria-pressed="false"><span class="stamp" data-icon="route"></span><span class="lb">Trip</span></button>
  </nav>

  <div id="region"><div class="en">Central Japan</div></div>
  <!-- map key: all of Japan with the current view framed in vermilion. Drawn by js/inset.js -->
  <canvas id="inset" width="88" height="104" tabindex="0" role="button" aria-label="Map key"></canvas>

  <aside id="card" aria-hidden="true" aria-label="Place details">
    <div class="grab"></div>
    <button class="x" aria-label="Close">×</button>
    <div class="scrollbox">
      <div class="head"><span class="cseal"></span><span class="cname">Temple</span><span class="status">Must-see</span></div>
      <h2 class="title"></h2>
      <div class="jp" lang="ja"></div>
      <div class="reg"></div>
      <p class="why"></p>
      <dl class="rows"></dl>
      <div class="btns">
        <button class="btn add" type="button">Add to trip</button>
        <button class="btn pass" type="button">Pass</button>
      </div>
      <div class="src"></div>
    </div>
  </aside>

  <div id="whoPick" class="overlay" hidden>
    <div class="sheet">
      <div class="q">Who is using this phone?</div>
      <div class="pair">
        <button class="who-btn" data-who="cade"><span class="big" data-icon="person"></span><b>Cade</b></button>
        <button class="who-btn" data-who="casey"><span class="big" data-icon="person"></span><b>Casey</b></button>
      </div>
    </div>
  </div>

  <!-- Phase 3: itinerary drawer (washi page) and fly-through player. Built by js/trip.js -->
  <aside id="drawer" aria-label="Itinerary"></aside>
  <div id="player" aria-label="Fly-through"></div>
  <!-- Phase 3: symbol tooltip (hover on Mac, long press on iPhone/iPad). Built by js/tips.js -->
  <div id="tip" role="tooltip" hidden></div>

  <div id="fade"></div>
  <div id="loading"><div class="brush"></div><div class="txt">Grinding the ink…<br><span>Loading the map</span></div></div>
</div>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.hostname !== '127.0.0.1' && location.hostname !== 'localhost') { addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
